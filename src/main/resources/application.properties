spring.application.name=payment-processing

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/payment_processing
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=payment-processing-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.payment.payment_processing.payment.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.payment.payment_processing.payment.event.PaymentEvent

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JW
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Server
server.port=8080