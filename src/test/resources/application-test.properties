spring.application.name=payment-processing-test

# Test Database - H2 for unit tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled for tests with H2
spring.flyway.enabled=false

# JWT for tests
jwt.secret=test-secret-key-for-jwt-generation-in-tests-must-be-long-enough
jwt.expiration=3600000

# Server
server.port=0

# Redis - disabled for unit tests, will use Testcontainers in integration tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka - disabled for unit tests, will use Testcontainers in integration tests
spring.kafka.bootstrap-servers=localhost:9092
